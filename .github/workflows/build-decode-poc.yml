# Decode PoC image: same S0 as prefill, plus overlays/vllm-0.28-decode.
# The overlay is Python. Do not compile it with nvcc or cucc.
# CPU build on the S0 self-hosted runner. ubuntu-latest does not have
# the disk for the ~20 GB base.

name: Build decode PoC image

on:
  workflow_dispatch:
    inputs:
      s0:
        description: S0 base image (vLLM 0.28 / MACA 3.8.2)
        required: true
        default: ghcr.io/opendops/vllm-metax:0.28.0-maca3.8.2
      tag:
        description: Tag to publish
        required: true
        default: ghcr.io/opendops/vllm-poc-metax:0.28.0-maca3.8.2-decode
      push:
        description: Push the image to GHCR
        type: boolean
        default: true

concurrency:
  group: build-decode-poc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Disk snapshot
        run: |
          set -euo pipefail
          df -h / /mnt/blockstorage 2>/dev/null || df -h
          docker system df 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vllm-decode-metax
          platforms: linux/amd64
          push: ${{ inputs.push }}
          load: ${{ inputs.push == false }}
          tags: ${{ inputs.tag }}
          build-args: |
            S0=${{ inputs.s0 }}
          provenance: false

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Decode PoC image"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| ref | \`${{ github.ref }}\` |"
            echo "| S0 | \`${{ inputs.s0 }}\` |"
            echo "| tag | \`${{ inputs.tag }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| pushed | \`${{ inputs.push }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
